name: Abruf Nextbike Aachen

on:
  schedule:
    # alle 30 Minuten starten, jeder Lauf dauert ca. 50 Minuten
    # -> Läufe überlappen sich, ein verspäteter oder ausgefallener Start wird aufgefangen
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  abruf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Repository holen
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Paket installieren
        run: pip install requests

      - name: Daten abrufen (Schleife)
        run: python abruf_schleife.py

      - name: Ergebnis speichern
        if: always()
        run: |
          git config user.name "abruf-bot"
          git config user.email "abruf-bot@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "nichts zu speichern"
            exit 0
          fi
          git commit -m "Daten $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase && git push; then
              exit 0
            fi
            sleep $((RANDOM % 15 + 5))
          done
          echo "Push fehlgeschlagen"
          exit 1
