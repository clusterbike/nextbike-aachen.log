name: Abruf Nextbike Aachen

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: abruf
  cancel-in-progress: false

jobs:
  abruf:
    runs-on: ubuntu-latest
    steps:
      - name: Repository holen
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Paket installieren
        run: pip install requests

      - name: Daten abrufen
        run: python abruf_einmal.py

      - name: Ergebnis speichern
        run: |
          git config user.name "abruf-bot"
          git config user.email "abruf-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Daten $(date -u +'%Y-%m-%d %H:%M')"
          git push
